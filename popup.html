<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Comment Categorizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="header-title">
      <span class="logo-icon">📊</span>
      <h1>Comment Categorizer</h1>
    </div>
    <button id="refreshBtn" class="icon-btn" title="Refresh comments count">🔄</button>
  </header>

  <main id="appContent">
    <!-- Status / Notification Bar -->
    <div id="statusBanner" class="status-banner hidden"></div>

    <!-- Summary Stats Bar -->
    <section class="summary-section">
      <div class="total-stat">
        <span class="total-label">Visible Comments:</span>
        <span id="totalCount" class="total-badge">0</span>
      </div>
      <p class="summary-hint">Lazy-loaded as you scroll down YouTube</p>
    </section>

    <!-- Categories List & Snippets -->
    <section id="categoriesContainer" class="categories-list">
      <!-- Injected dynamically by popup.js -->
    </section>
  </main>

  <footer class="app-footer">
    <span>Zero-memory duplicate • Pure JS</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
